<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English → Amharic Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ec; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#171b23; --ink:#e7eaf0; --muted:#98a0b3; --line:#2a303c; --accent:#4c8dff; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, "Noto Sans Ethiopic", system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px } p.sub { color:var(--muted); margin:0 0 24px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px }
  textarea { width:100%; min-height:96px; font:inherit; font-size:1.05rem; padding:12px; border-radius:8px;
             border:1px solid var(--line); background:transparent; color:inherit; resize:vertical }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px }
  select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:inherit }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; font-weight:600 }
  button.primary:disabled { opacity:.6 }
  label { color:var(--muted); font-size:.9rem }
  .out { font-family:"Noto Sans Ethiopic", sans-serif; font-size:1.5rem; line-height:1.6; min-height:2.4rem }
  .meta { color:var(--muted); font-size:.85rem; margin-top:6px }
  .examples button { font-size:.85rem; cursor:pointer }
  .heat { overflow-x:auto; margin-top:12px }
  .scope { font-size:.92rem; color:var(--muted) } .scope b { color:var(--ink) }
  .warn { margin-top:10px; padding:10px 12px; border-radius:8px; font-size:.92rem;
          background:rgba(234,160,40,.14); border:1px solid rgba(234,160,40,.45) }
  table.att { border-collapse:collapse; font-size:.75rem }
  table.att td { width:26px; height:24px; text-align:center; border:1px solid var(--line) }
  table.att th { font-weight:400; padding:2px 6px; white-space:nowrap }
  table.att thead th { writing-mode:vertical-rl; transform:rotate(180deg); height:80px; text-align:left }
  table.att tbody th { text-align:right; font-family:"Noto Sans Ethiopic", sans-serif; font-size:.9rem }
</style>
</head>
<body>
<main>
  <h1>English → Amharic Neural Machine Translation</h1>
  <p class="sub">LSTM encoder–decoder models trained from scratch on 692k English–Amharic sentence pairs.</p>
  <div class="card scope" id="scope"></div>

  <div class="card">
    <textarea id="text" placeholder="Type an English sentence…">I am going to the university.</textarea>
    <div class="row examples" id="examples"></div>
    <div class="row">
      <label>Model <select id="model"><option value="bahdanau">Attention-LSTM</option><option value="seq2seq">Seq2Seq-LSTM (baseline)</option></select></label>
      <label>Beam <select id="beam"><option>1</option><option>3</option><option selected>5</option><option>8</option></select></label>
      <button class="primary" id="go">Translate</button>
    </div>
  </div>

  <div class="card">
    <div class="out" id="out"></div>
    <div class="meta" id="meta"></div>
    <div id="warn"></div>
    <div class="heat" id="heat"></div>
  </div>
</main>
<script>
const EX = ["She is Ethiopian and was born there.", "How much does this book cost?", "The farmers are waiting for the rain.",
            "Where is the hospital?", "Our school has many students and teachers.", "Thank you very much."];
const $ = id => document.getElementById(id);
EX.forEach(e => { const b = document.createElement("button"); b.textContent = e;
  b.onclick = () => { $("text").value = e; go(); }; $("examples").appendChild(b); });

// SentencePiece marks a word start with "▁"; show it as a plain token for readability
function esc(s) { s = s.replace(/^▁/, "") || "␣"; return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function heatmap(r) {
  if (!r.attention) return "";
  const head = "<thead><tr><th></th>" + r.src_tokens.map(t => `<th>${esc(t)}</th>`).join("") + "</tr></thead>";
  const body = r.attention.map((row, i) => `<tr><th>${esc(r.tgt_tokens[i])}</th>` +
    row.map(v => `<td title="${v.toFixed(2)}" style="background:rgba(31,111,235,${v.toFixed(3)})"></td>`).join("") + "</tr>").join("");
  return `<div class="meta">Attention: rows = Amharic output tokens, columns = English source tokens</div><table class="att">${head}<tbody>${body}</tbody></table>`;
}

async function go() {
  const text = $("text").value.trim(); if (!text) return;
  $("go").disabled = true; $("out").textContent = "…"; $("heat").innerHTML = ""; $("warn").innerHTML = "";
  try {
    const res = await fetch("/translate", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text, model:$("model").value, beam:+$("beam").value, return_attention:true }) });
    const r = await res.json();
    if (!res.ok) throw new Error(JSON.stringify(r.detail));
    $("out").textContent = r.translation;
    $("meta").textContent = `${r.model} · ${r.latency_ms} ms`;
    $("warn").innerHTML = (r.warnings || []).map(w => `<div class="warn">⚠ ${esc2(w)}</div>`).join("");
    $("heat").innerHTML = heatmap(r);
  } catch (e) { $("out").textContent = "Error: " + e.message; }
  $("go").disabled = false;
}
function esc2(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
fetch("/scope").then(r => r.json()).then(r => { $("scope").innerHTML = "<b>What this translator handles.</b> " + esc2(r.scope); });
$("go").onclick = go;
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(); });
</script>
</body>
</html>
